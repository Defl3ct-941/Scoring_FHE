# CI GitLab de l'outil fhecli (03_cas_pratiques/fhe-exercices-cli).
#
# Tests (Python 3.11 et 3.15), exécutable autonome Linux, wheel et sdist.
# Les exécutables Windows et macOS sont construits par GitHub Actions
# (.github/workflows/fhecli.yml) : il faudrait des runners Windows/macOS
# dédiés pour les construire ici.
# Publication PyPI : job manuel sur un tag « fhecli-vX.Y.Z », avec la variable
# protégée et masquée PYPI_API_TOKEN (Settings > CI/CD > Variables).

stages: [test, build, publish]

variables:
  CLI_DIR: 03_cas_pratiques/fhe-exercices-cli
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip
  paths: [.cache/pip]

.fhecli-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^fhecli-v/
    - changes:
        - 03_cas_pratiques/fhe-exercices-cli/**/*
        - .gitlab-ci.yml

tests:
  stage: test
  extends: .fhecli-rules
  image: python:${PYTHON}-slim
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.15"]
  script:
    - cd "$CLI_DIR"
    - python -m pip install -e .
    - python -m pytest tests -q

binary-linux:
  stage: build
  extends: .fhecli-rules
  # Debian bookworm (glibc 2.36) : binaire compatible avec plus de distributions.
  image: python:3.15-slim-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq binutils
  script:
    - cd "$CLI_DIR"
    - python -m pip install -e . pyinstaller
    - python scripts/build_binary.py
  artifacts:
    name: fhecli-linux-x86_64
    paths:
      - $CLI_DIR/dist/fhecli-*
    expire_in: 30 days

package:
  stage: build
  extends: .fhecli-rules
  image: python:3.15-slim
  script:
    - cd "$CLI_DIR"
    - python -m pip install build twine
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        version=$(python -c "import sys; sys.path.insert(0, '.'); import fhecli; print(fhecli.__version__)")
        test "$CI_COMMIT_TAG" = "fhecli-v$version" || { echo "Tag $CI_COMMIT_TAG != fhecli-v$version"; exit 1; }
      fi
    - python -m build
    - python -m twine check --strict dist/*
  artifacts:
    paths:
      - $CLI_DIR/dist/*.whl
      - $CLI_DIR/dist/*.tar.gz
    expire_in: 30 days

pypi:
  stage: publish
  image: python:3.15-slim
  needs: [package, binary-linux]
  rules:
    - if: $CI_COMMIT_TAG =~ /^fhecli-v/
      when: manual
  script:
    - python -m pip install twine
    - python -m twine upload --non-interactive -u __token__ -p "$PYPI_API_TOKEN" "$CLI_DIR"/dist/*.whl "$CLI_DIR"/dist/*.tar.gz
