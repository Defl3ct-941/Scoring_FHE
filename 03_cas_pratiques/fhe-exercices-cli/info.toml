# Liste des exercices, dans l'ordre pedagogique suivi par `fhecli watch`.
#
# Version actuelle : seul le module A (chiffrement classique) est publie.
# Les modules suivants (arithmetique modulaire, Paillier from scratch,
# scoring chiffre, bonus CKKS) arriveront dans une prochaine mise a jour.

[[exercises]]
name = "ex1_cesar"
category = "A. Chiffrement classique"
title = "Le chiffrement de Cesar"
difficulty = "facile"
hint = "Pour tester si `c` est une lettre, utilisez 'a' <= c <= 'z' (et 'A' <= c <= 'Z'), pas c.islower()/c.isupper() qui renvoient aussi True pour les lettres accentuees comme e ou a. La nouvelle position est (position + shift) % 26."

[[exercises]]
name = "ex2_xor_malleability"
category = "A. Chiffrement classique"
title = "XOR et le danger de la malleabilite"
difficulty = "facile"
hint = "reveal_xor_of_plaintexts ne fait qu'une seule chose : XOR c1 et c2 entre eux (reutilisez xor_bytes). C'est le XOR qui annule la cle, pas une astuce compliquee."

[[exercises]]
name = "ex3_fernet_tamper"
category = "A. Chiffrement classique"
title = "Chiffrement authentifie avec Fernet"
difficulty = "facile"
hint = "bytearray(token) permet de modifier un octet d'un bytes immuable : data[0] ^= 0xFF. Attrapez cryptography.fernet.InvalidToken avec un try/except."
