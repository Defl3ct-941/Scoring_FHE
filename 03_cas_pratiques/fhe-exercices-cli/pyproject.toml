[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fhe-cli"
dynamic = ["version"]
description = "Atelier d'exercices en ligne de commande, à la rustlings : chiffrement classique et chiffrement homomorphe (FHE)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Ravin THILAGARASA" },
    { name = "Thomas GRUNDSZTEJN" },
]
keywords = [
    "fhe", "chiffrement homomorphe", "homomorphic encryption", "cryptographie",
    "cryptography", "exercices", "rustlings", "enseignement", "scoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pytest>=9.2,<10",
    "cryptography>=50.0,<51",
    # Bonus ex10 (CKKS) : TenSEAL est installé automatiquement partout où une
    # wheel existe (Python 3.11 à 3.14 ; Windows, Linux, macOS 14+ Apple
    # Silicon). Ailleurs (Python 3.15, Mac Intel, macOS 11 à 13), il est exclu
    # pour que pip ne tente jamais de le compiler : l'ex10 y est ignoré.
    # macOS < 14 est détecté par un test de chaîne sur platform_version
    # (Darwin 20 à 22) : comparer platform_release ferait planter pip 23-24
    # sous Linux (version de noyau invalide).
    "tenseal>=0.3.18,<0.4; python_version < '3.15' and (sys_platform != 'darwin' or (platform_machine == 'arm64' and 'Darwin Kernel Version 20.' not in platform_version and 'Darwin Kernel Version 21.' not in platform_version and 'Darwin Kernel Version 22.' not in platform_version))",
]

[project.urls]
Homepage = "https://github.com/Defl3ct-941/Scoring_FHE"
Source = "https://github.com/Defl3ct-941/Scoring_FHE/tree/main/03_cas_pratiques/fhe-exercices-cli"
Issues = "https://github.com/Defl3ct-941/Scoring_FHE/issues"
GitLab = "https://gitlab.securechat.fr/esgi/5a/Scoring_FHE"
Changelog = "https://github.com/Defl3ct-941/Scoring_FHE/blob/main/CHANGELOG.md"

[project.scripts]
fhe-cli = "fhecli.cli:main"
# Ancien nom de la commande, conservé comme alias.
fhecli = "fhecli.cli:main"

[tool.setuptools]
packages = ["fhecli"]
include-package-data = false

[tool.setuptools.package-data]
# Données embarquées : liste des exercices, énoncés d'origine, solutions et
# vérifications ENCODÉES. Les sources en clair (solutions_src/, checks_src/)
# ne sont jamais incluses.
fhecli = ["data/info.toml", "data/originals/*.py", "data/solutions/*.sol", "data/checks/*.chk"]

[tool.setuptools.dynamic]
version = { attr = "fhecli.__version__" }
