[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhecli"
version = "1.0.0"
description = "Atelier d'exercices CLI (a la rustlings) : chiffrement classique et FHE"
requires-python = ">=3.11"
authors = [
    { name = "Ravin THILAGARASA" },
    { name = "Thomas GRUNDSZTEJN" },
]
dependencies = [
    "pytest>=8.3,<10",
    "cryptography>=43.0,<44",
]

[project.scripts]
fhecli = "fhecli.cli:main"

[tool.setuptools]
packages = ["fhecli"]
