[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhecli"
version = "1.0.0"
description = "Atelier d'exercices CLI (a la rustlings) : chiffrement classique et FHE"
requires-python = ">=3.11"
authors = [
    { name = "Ravin THILAGARASA" },
    { name = "Thomas GRUNDSZTEJN" },
]
dependencies = [
    "pytest>=9.2,<10",
    "cryptography>=50.0,<51",
]

[project.scripts]
fhecli = "fhecli.cli:main"

[tool.setuptools]
packages = ["fhecli"]
