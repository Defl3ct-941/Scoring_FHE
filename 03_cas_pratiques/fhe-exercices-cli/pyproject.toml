[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fhe-cli"
dynamic = ["version"]
description = "Atelier d'exercices en ligne de commande, à la rustlings : chiffrement classique et chiffrement homomorphe (FHE)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Ravin THILAGARASA" },
    { name = "Thomas GRUNDSZTEJN" },
]
keywords = [
    "fhe", "chiffrement homomorphe", "homomorphic encryption", "cryptographie",
    "cryptography", "exercices", "rustlings", "enseignement", "scoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pytest>=9.2,<10",
    "cryptography>=50.0,<51",
    # Bonus ex10 (CKKS) : TenSEAL est installé automatiquement partout où il
    # existe (Python 3.11 à 3.14 ; Windows, Linux, macOS Apple Silicon). Il n'a
    # pas encore de version pour Python 3.15 ni pour les Mac Intel : l'ex10 y
    # est alors ignoré, le reste de l'atelier fonctionne normalement.
    "tenseal>=0.3.18,<0.4; python_version < '3.15' and (platform_system != 'Darwin' or platform_machine == 'arm64')",
]

[project.urls]
Homepage = "https://github.com/Defl3ct-941/Scoring_FHE"
Source = "https://github.com/Defl3ct-941/Scoring_FHE/tree/main/03_cas_pratiques/fhe-exercices-cli"
Issues = "https://github.com/Defl3ct-941/Scoring_FHE/issues"
GitLab = "https://gitlab.securechat.fr/esgi/5a/Scoring_FHE"
Changelog = "https://github.com/Defl3ct-941/Scoring_FHE/blob/main/CHANGELOG.md"

[project.scripts]
fhecli = "fhecli.cli:main"

[tool.setuptools]
packages = ["fhecli"]
include-package-data = false

[tool.setuptools.package-data]
# Données embarquées : liste des exercices, énoncés d'origine et solutions
# ENCODÉES. Les solutions en clair (solutions_src/) ne sont jamais incluses.
fhecli = ["data/info.toml", "data/originals/*.py", "data/solutions/*.sol"]

[tool.setuptools.dynamic]
version = { attr = "fhecli.__version__" }
